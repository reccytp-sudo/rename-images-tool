<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防火閘重新命名與統計</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <style>
        /* 奶油風色票 (Creamy Style) */
        :root {
            --primary-color: #D4A373;
            --primary-hover: #C38D59;
            --success-color: #8CB369;
            --success-hover: #7A9F5A; 
            --danger-color: #E29578;
            --danger-hover: #CF7E60;
            --bg-color: #FAF8F5;
            --text-color: #5C4D43;
            --border-color: #EAE0D5;
            --warning-color: #F4A261;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(92, 77, 67, 0.08);
            padding: 2rem;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 2rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* ---------------- 資料輸入表單區塊 ---------------- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: #FDFCFB;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #DCD3C6;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #FFFFFF;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }
        /* ------------------------------------------------ */

        .drop-zone {
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #FDFCFB;
            margin-bottom: 2rem;
        }

        .drop-zone.dragover {
            background-color: #F5EBE1;
            border-color: var(--primary-hover);
            transform: scale(1.01);
        }

        .drop-zone p {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .drop-zone span {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #A39184;
        }

        #file-input {
            display: none;
        }

        .table-container {
            display: block; 
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #FFFFFF;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #F9F6F0;
            position: sticky;
            top: 0;
            z-index: 10;
            color: var(--text-color);
            font-weight: 600;
        }

        tr:hover {
            background-color: #FDFCFB;
        }

        .status-label { color: #7A9F5A; font-weight: 500; }
        .status-warning { color: var(--warning-color); font-weight: 500; }
        
        .empty-state {
            text-align: center;
            color: #A39184;
            padding: 2rem !important;
            font-style: italic;
        }

        .actions {
            display: flex;
            margin-top: 1.5rem;
            text-align: right;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        button {
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-primary { background-color: var(--primary-color); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        .btn-excel { background-color: var(--success-color); }
        .btn-excel:hover { background-color: var(--success-hover); }

        .btn-reset { background-color: var(--danger-color); }
        .btn-reset:hover { background-color: var(--danger-hover); }

        button:disabled {
            background-color: var(--border-color) !important;
            color: #A39184 !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>防火閘重新命名與統計</h1>
        
        <!-- 表單區塊 (僅保留 Project, Location, Date) -->
        <div class="form-grid">
            <div class="form-group"><label>Project:</label><input type="text" id="in-project" placeholder="輸入 Project..."></div>
            <div class="form-group"><label>Location:</label><input type="text" id="in-location" placeholder="輸入 Location..."></div>
            <div class="form-group"><label>Date:</label><input type="text" id="in-date" placeholder="輸入 Date..."></div>
        </div>
        
        <div class="drop-zone" id="drop-zone">
            <p>點擊此處選擇圖片，或將圖片拖曳至此</p>
            <span>（支援 .jpg, .png 等常見格式）</span>
            <input type="file" id="file-input" multiple accept="image/*">
        </div>

        <div class="table-container" id="table-container">
            <table id="preview-table">
                <thead>
                    <tr>
                        <th>原始檔名</th>
                        <th>新檔名</th>
                        <th>狀態預覽</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr id="empty-row">
                        <td colspan="3" class="empty-state">尚未上傳任何圖片，請從上方選擇或拖曳檔案</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="actions" id="actions-container">
            <button id="reset-btn" class="btn-reset" disabled>🗑️ 重設清空</button>
            <button id="download-excel-btn" class="btn-excel" disabled>📊 下載統計 Excel</button>
            <button id="download-zip-btn" class="btn-primary" disabled>📦 確認及匯出ZIP檔</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const tbody = document.getElementById('table-body');
        
        const downloadZipBtn = document.getElementById('download-zip-btn');
        const downloadExcelBtn = document.getElementById('download-excel-btn');
        const resetBtn = document.getElementById('reset-btn');

        let processedFiles = []; 
        let statsData = {};      

        const val = (id) => document.getElementById(id).value || "";

        // 點擊與拖曳事件
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) processFiles(Array.from(e.dataTransfer.files));
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) processFiles(Array.from(e.target.files));
        });

        // 核心處理與統計邏輯
        function processFiles(files) {
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

            processedFiles = [];
            statsData = {}; 
            let currentLabel = "";
            let currentCounter = 0;

            tbody.innerHTML = ''; 

            files.forEach(file => {
                const originalName = file.name;
                let newName = "";
                let statusHtml = "";
                
                const lastDotIndex = originalName.lastIndexOf(".");
                const ext = lastDotIndex !== -1 ? originalName.slice(lastDotIndex) : "";
                
                const labelRegex = /_([^_]+?)\(1\)(?=\.[^.]+$)/i;
                const match = originalName.match(labelRegex);

                if (match) {
                    currentLabel = match[1]; 
                    currentCounter = 1;
                    newName = `${currentLabel}(${currentCounter})${ext}`;
                    statusHtml = `<span class="status-label">✅ 標籤圖更新: ${currentLabel}</span>`;
                } else {
                    if (currentLabel !== "") {
                        currentCounter++;
                        newName = `${currentLabel}(${currentCounter})${ext}`;
                        statusHtml = `<span class="status-label">✓ 自動遞增</span>`;
                    } else {
                        newName = originalName;
                        statusHtml = `<span class="status-warning">⚠️ 無所屬標籤，保持原名</span>`;
                    }
                }

                if (currentLabel !== "") {
                    // statsData 記錄的是每一個附帶括號的標籤（例如 "巴士站(1)"）
                    statsData[currentLabel] = (statsData[currentLabel] || 0) + 1;
                }

                processedFiles.push({ file, newName });

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${originalName}</td>
                    <td><strong>${newName}</strong></td>
                    <td>${statusHtml}</td>
                `;
                tbody.appendChild(tr);
            });

            resetBtn.disabled = false;
            downloadExcelBtn.disabled = false;
            downloadZipBtn.disabled = false;
        }

        // 功能 1：重設清空
        resetBtn.addEventListener('click', () => {
            processedFiles = [];
            statsData = {};
            
            tbody.innerHTML = `
                <tr id="empty-row">
                    <td colspan="3" class="empty-state">尚未上傳任何圖片，請從上方選擇或拖曳檔案</td>
                </tr>
            `;
            
            document.querySelectorAll('.form-grid input').forEach(input => {
                input.value = '';
            });
            
            resetBtn.disabled = true;
            downloadExcelBtn.disabled = true;
            downloadZipBtn.disabled = true;
            
            fileInput.value = '';
        });

        // 預先計算統計邏輯
        function calculateStats() {
            const baseStats = {};
            let totalQty = 0;
            
            for (const key of Object.keys(statsData)) {
                const baseLocation = key.replace(/\(\d+\)$/, '').trim();
                baseStats[baseLocation] = (baseStats[baseLocation] || 0) + 1;
            }

            for (const count of Object.values(baseStats)) {
                totalQty += count;
            }
            
            return { baseStats, totalQty };
        }

        // 功能 2：嚴格對齊最新 7 欄式設計的 Excel 下載
        downloadExcelBtn.addEventListener('click', () => {
            if (Object.keys(statsData).length === 0) return alert("目前沒有成功分類的統計資料！");

            const workbook = XLSX.utils.book_new();
            const { baseStats, totalQty } = calculateStats();

            // 定義 Excel 樣式（嚴格控制置中、靠左與框線）
            const centerAlign = { horizontal: "center", vertical: "center" };
            const leftAlign = { horizontal: "left", vertical: "center" };
            const rightAlign = { horizontal: "right", vertical: "center" };
            const borderAll = { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } };
            const borderBottom = { bottom: { style: "thin" } };
            const fontTitle = { name: "Arial", sz: 14, bold: true };
            const fontNormal = { name: "Arial", sz: 12 };

            const aoa = [];
            
            // 標題 Row 1-3 (Index 0~2)
            aoa.push([{v: "Summary of Fire Dampers", s: {font: fontTitle, alignment: centerAlign}}, "", "", "", "", "", ""]);
            aoa.push(["", "", "", "", "", "", ""]);
            aoa.push(["", "", "", "", "", "", ""]);
            
            // Row 4: Project
            aoa.push([
                {v: "Project:", s: {font: fontNormal, alignment: centerAlign}}, "", "", 
                {v: val('in-project'), s: {font: fontNormal, alignment: leftAlign, border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}
            ]);
            
            // Row 5: 空白
            aoa.push(["", "", "", "", "", "", ""]);
            
            // Row 6: Location
            aoa.push([
                {v: "Location:", s: {font: fontNormal, alignment: centerAlign}}, "", "", 
                {v: val('in-location'), s: {font: fontNormal, alignment: leftAlign, border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}
            ]);
            
            // Row 7: 空白
            aoa.push(["", "", "", "", "", "", ""]);
            
            // Row 8: Fire Damper (總數) - 注意 D 欄為獨立格子含底線
            aoa.push([
                {v: "Fire Damper:", s: {font: fontNormal, alignment: centerAlign}}, "", "", 
                {v: totalQty, s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, 
                "", "", ""
            ]);
            
            // Row 9: 空白
            aoa.push(["", "", "", "", "", "", ""]);
            
            // Row 10: Inspection Date
            aoa.push([
                {v: "Inspection Date:", s: {font: fontNormal, alignment: centerAlign}}, "", "", 
                {v: val('in-date'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                "", ""
            ]);
            
            // Row 11-12: 空白
            aoa.push(["", "", "", "", "", "", ""]);
            aoa.push(["", "", "", "", "", "", ""]);

            // Headers Row 13 (完美配合 7 欄格式)
            const thStyle = { font: fontNormal, alignment: centerAlign, border: borderAll };
            aoa.push([
                {v: "Ref. No.", s: thStyle}, {v: "", s: thStyle},
                {v: "Location", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle},
                {v: "Qty", s: thStyle}
            ]);

            // Data Rows (資料置中對齊且全框線配合 A~G 欄合併)
            let rowIdx = 1;
            for (const [base, count] of Object.entries(baseStats)) {
                aoa.push([
                    {v: rowIdx, s: thStyle}, {v: "", s: thStyle},
                    {v: base, s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle},
                    {v: count, s: thStyle}
                ]);
                rowIdx++;
            }

            // Total 前的一行空框線
            aoa.push([
                {v: "", s: thStyle}, {v: "", s: thStyle},
                {v: "", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle},
                {v: "", s: thStyle}
            ]);

            // Total Row (A:B 合併空白, C:E 合併空白, F 是 "Total:", G 是數量)
            aoa.push([
                {v: "", s: thStyle}, {v: "", s: thStyle},
                {v: "", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle},
                {v: "Total:", s: {font: fontNormal, alignment: rightAlign, border: borderAll}},
                {v: totalQty, s: thStyle}
            ]);

            const ws = XLSX.utils.aoa_to_sheet(aoa);

            // 跨欄置中與合併儲存格設定 (嚴格遵照 7 欄式設計)
            const merges = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 6 } }, // A1:G1 標題
                { s: { r: 3, c: 0 }, e: { r: 3, c: 2 } }, // A4:C4 Project:
                { s: { r: 3, c: 3 }, e: { r: 3, c: 6 } }, // D4:G4 Project Value
                { s: { r: 5, c: 0 }, e: { r: 5, c: 2 } }, // A6:C6 Location:
                { s: { r: 5, c: 3 }, e: { r: 5, c: 6 } }, // D6:G6 Location Value
                { s: { r: 7, c: 0 }, e: { r: 7, c: 2 } }, // A8:C8 Fire Damper:
                // D8 為獨立不合併的儲存格
                { s: { r: 9, c: 0 }, e: { r: 9, c: 2 } }, // A10:C10 Inspection Date:
                { s: { r: 9, c: 3 }, e: { r: 9, c: 4 } }, // D10:E10 Date Value
            ];

            // 處理表格內的合併 (Ref. No -> A:B, Location -> C:F, Qty -> G 獨立)
            let startRow = 12; // Row 13 (index 12)
            for(let i = 0; i < rowIdx + 2; i++){
                merges.push({ s: { r: startRow + i, c: 0 }, e: { r: startRow + i, c: 1 } }); // A:B
                
                if (i < rowIdx + 1) { 
                    // 一般資料列及空白列: C:F 合併
                    merges.push({ s: { r: startRow + i, c: 2 }, e: { r: startRow + i, c: 5 } });
                } else { 
                    // Total 列: C:E 合併, F是"Total:"
                    merges.push({ s: { r: startRow + i, c: 2 }, e: { r: startRow + i, c: 4 } });
                }
            }

            ws['!merges'] = merges;

            // 完美對應 7 欄式欄寬設定 (完全按照您 Excel 檔案的屬性)
            ws['!cols'] = [
                { wch: 6.4 },  // A
                { wch: 6.4 },  // B
                { wch: 8.4 },  // C
                { wch: 12.4 }, // D
                { wch: 12.6 }, // E
                { wch: 14.8 }, // F
                { wch: 19.0 }  // G
            ];

            XLSX.utils.book_append_sheet(workbook, ws, "Summary_Report");
            XLSX.writeFile(workbook, "Summary_Report.xlsx");
        });

        // 功能 3：打包下載 ZIP
        downloadZipBtn.addEventListener('click', async () => {
            if (processedFiles.length === 0) return;

            const originalText = downloadZipBtn.innerText;
            downloadZipBtn.innerText = "打包中，請稍候...";
            downloadZipBtn.disabled = true;

            try {
                const zip = new JSZip();
                processedFiles.forEach(item => {
                    zip.file(item.newName, item.file);
                });
                const content = await zip.generateAsync({ type: "blob" });
                
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = "Renamed_Images.zip";
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error("ZIP 打包失敗:", error);
                alert("打包過程發生錯誤，請查看 Console。");
            } finally {
                downloadZipBtn.innerText = originalText;
                downloadZipBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
