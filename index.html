<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防火閘重新命名與統計</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <style>
        /* 奶油風色票 (Creamy Style) */
        :root {
            --primary-color: #D4A373;
            --primary-hover: #C38D59;
            --success-color: #8CB369;
            --success-hover: #7A9F5A; 
            --danger-color: #E29578;
            --danger-hover: #CF7E60;
            --bg-color: #FAF8F5;
            --text-color: #5C4D43;
            --border-color: #EAE0D5;
            --warning-color: #F4A261;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(92, 77, 67, 0.08);
            padding: 2rem;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 2rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* ---------------- 資料輸入表單區塊 ---------------- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: #FDFCFB;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #DCD3C6;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #FFFFFF;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }
        /* ------------------------------------------------ */

        .drop-zone {
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #FDFCFB;
            margin-bottom: 2rem;
        }

        .drop-zone.dragover {
            background-color: #F5EBE1;
            border-color: var(--primary-hover);
            transform: scale(1.01);
        }

        .drop-zone p {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .drop-zone span {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #A39184;
        }

        #file-input {
            display: none;
        }

        .table-container {
            display: block; 
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #FFFFFF;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #F9F6F0;
            position: sticky;
            top: 0;
            z-index: 10;
            color: var(--text-color);
            font-weight: 600;
        }

        tr:hover {
            background-color: #FDFCFB;
        }

        .status-label { color: #7A9F5A; font-weight: 500; }
        .status-warning { color: var(--warning-color); font-weight: 500; }
        
        .empty-state {
            text-align: center;
            color: #A39184;
            padding: 2rem !important;
            font-style: italic;
        }

        .actions {
            display: flex;
            margin-top: 1.5rem;
            text-align: right;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        button {
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-primary { background-color: var(--primary-color); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        .btn-excel { background-color: var(--success-color); }
        .btn-excel:hover { background-color: var(--success-hover); }
        
        .btn-reset { background-color: var(--danger-color); }
        .btn-reset:hover { background-color: var(--danger-hover); }

        button:disabled {
            background-color: var(--border-color) !important;
            color: #A39184 !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>防火閘重新命名與統計</h1>
        
        <!-- 表單區塊 (無 Fire Damper 欄位) -->
        <div class="form-grid">
            <div class="form-group"><label>Project:</label><input type="text" id="in-project" placeholder="輸入 Project..."></div>
            <div class="form-group"><label>Location:</label><input type="text" id="in-location" placeholder="輸入 Location..."></div>
            <div class="form-group"><label>Date:</label><input type="text" id="in-date" placeholder="輸入 Date..."></div>
            <div class="form-group"><label>FSD Ref.:</label><input type="text" id="in-fsd" placeholder="輸入 FSD Ref..."></div>
            <div class="form-group"><label>Our Ref.:</label><input type="text" id="in-our-ref" placeholder="輸入 Our Ref..."></div>
            <div class="form-group"><label>Rev. No.:</label><input type="text" id="in-rev" placeholder="輸入 Rev. No..."></div>
            <div class="form-group"><label>Inspected:</label><input type="text" id="in-inspected" placeholder="輸入 Inspected..."></div>
            <div class="form-group"><label>Prepared By:</label><input type="text" id="in-prepared" placeholder="輸入 Prepared By..."></div>
            <div class="form-group"><label>Reviewed By:</label><input type="text" id="in-reviewed" placeholder="輸入 Reviewed By..."></div>
        </div>
        
        <div class="drop-zone" id="drop-zone">
            <p>點擊此處選擇圖片，或將圖片拖曳至此</p>
            <span>（支援 .jpg, .png 等常見格式）</span>
            <input type="file" id="file-input" multiple accept="image/*">
        </div>

        <div class="table-container" id="table-container">
            <table id="preview-table">
                <thead>
                    <tr>
                        <th>原始檔名</th>
                        <th>新檔名</th>
                        <th>狀態預覽</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr id="empty-row">
                        <td colspan="3" class="empty-state">尚未上傳任何圖片，請從上方選擇或拖曳檔案</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="actions" id="actions-container">
            <button id="reset-btn" class="btn-reset" disabled>🗑️ 重設清空</button>
            <button id="download-excel-btn" class="btn-excel" disabled>📊 下載統計 Excel</button>
            <button id="download-zip-btn" class="btn-primary" disabled>📦 確認及匯出ZIP檔</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const tbody = document.getElementById('table-body');
        
        const downloadZipBtn = document.getElementById('download-zip-btn');
        const downloadExcelBtn = document.getElementById('download-excel-btn');
        const resetBtn = document.getElementById('reset-btn');

        let processedFiles = []; 
        let statsData = {};      

        // 點擊與拖曳事件
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) processFiles(Array.from(e.dataTransfer.files));
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) processFiles(Array.from(e.target.files));
        });

        // 核心處理與統計邏輯
        function processFiles(files) {
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

            processedFiles = [];
            statsData = {}; 
            let currentLabel = "";
            let currentCounter = 0;

            tbody.innerHTML = ''; 

            files.forEach(file => {
                const originalName = file.name;
                let newName = "";
                let statusHtml = "";
                
                const lastDotIndex = originalName.lastIndexOf(".");
                const ext = lastDotIndex !== -1 ? originalName.slice(lastDotIndex) : "";
                
                const labelRegex = /_([^_]+?)\(1\)(?=\.[^.]+$)/i;
                const match = originalName.match(labelRegex);

                if (match) {
                    currentLabel = match[1]; 
                    currentCounter = 1;
                    newName = `${currentLabel}(${currentCounter})${ext}`;
                    statusHtml = `<span class="status-label">✅ 標籤圖更新: ${currentLabel}</span>`;
                } else {
                    if (currentLabel !== "") {
                        currentCounter++;
                        newName = `${currentLabel}(${currentCounter})${ext}`;
                        statusHtml = `<span class="status-label">✓ 自動遞增</span>`;
                    } else {
                        newName = originalName;
                        statusHtml = `<span class="status-warning">⚠️ 無所屬標籤，保持原名</span>`;
                    }
                }

                if (currentLabel !== "") {
                    // statsData 記錄的是每一個附帶括號的標籤（例如 "巴士站(1)"）
                    statsData[currentLabel] = (statsData[currentLabel] || 0) + 1;
                }

                processedFiles.push({ file, newName });

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${originalName}</td>
                    <td><strong>${newName}</strong></td>
                    <td>${statusHtml}</td>
                `;
                tbody.appendChild(tr);
            });

            resetBtn.disabled = false;
            downloadExcelBtn.disabled = false;
            downloadZipBtn.disabled = false;
        }

        // 功能 1：重設清空
        resetBtn.addEventListener('click', () => {
            processedFiles = [];
            statsData = {};
            
            tbody.innerHTML = `
                <tr id="empty-row">
                    <td colspan="3" class="empty-state">尚未上傳任何圖片，請從上方選擇或拖曳檔案</td>
                </tr>
            `;
            
            // 清空上方所有輸入欄位
            document.querySelectorAll('.form-grid input').forEach(input => {
                input.value = '';
            });
            
            resetBtn.disabled = true;
            downloadExcelBtn.disabled = true;
            downloadZipBtn.disabled = true;
            
            fileInput.value = '';
        });

        // 功能 2：下載 1:1 Excel 模板
        downloadExcelBtn.addEventListener('click', () => {
            if (Object.keys(statsData).length === 0) {
                alert("目前沒有成功分類的統計資料！");
                return;
            }

            const workbook = XLSX.utils.book_new();
            const val = (id) => document.getElementById(id).value || "";
            const inspectedName = val('in-inspected');

            // --- 預先計算主地點統計與總數 ---
            const baseStats = {};
            let totalQty = 0;
            
            for (const key of Object.keys(statsData)) {
                // 將字尾的 `(數字)` 拔除以萃取主地點名稱
                const baseLocation = key.replace(/\(\d+\)$/, '').trim();
                // 每次出現一個帶有括號的分類，代表找到了一個該地點的閘門，次數 +1
                baseStats[baseLocation] = (baseStats[baseLocation] || 0) + 1;
            }

            // 計算所有主地點的數量總和
            for (const count of Object.values(baseStats)) {
                totalQty += count;
            }
            // -----------------------------

            // 定義樣式
            const centerAlign = { horizontal: "center", vertical: "center" };
            const rightAlign = { horizontal: "right", vertical: "center" };
            const borderAll = {
                top: { style: "thin" },
                bottom: { style: "thin" },
                left: { style: "thin" },
                right: { style: "thin" }
            };
            const borderBottom = { bottom: { style: "thin" } };
            
            const fontTitle = { name: "Arial", sz: 14, bold: true };
            const fontNormal = { name: "Arial", sz: 12 };
            const fontBold = { name: "Arial", sz: 12, bold: true };

            const aoa = [];
            
            // Row 1-3
            aoa.push([{v: "FIRE DAMPERS INSPECTION", s: {font: fontTitle, alignment: centerAlign}}, "", "", "", "", "", "", "", ""]);
            aoa.push([]);
            aoa.push([]);
            
            // Row 4
            aoa.push([
                {v: "Project:", s: {font: fontNormal}}, // A
                {v: val('in-project'), s: {font: fontNormal, border: borderBottom}}, // B
                {v: "", s: {border: borderBottom}}, // C
                {v: "", s: {border: borderBottom}}, // D
                {v: "Date:", s: {font: fontNormal}}, // E
                {v: val('in-date'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, // F
                {v: "", s: {border: borderBottom}}, // G
                {v: "", s: {border: borderBottom}}, // H
                "" // I
            ]);
            // Row 5
            aoa.push([
                "", "", "", "",
                {v: "FSD Ref.:", s: {font: fontNormal}}, // E
                {v: val('in-fsd'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, // F
                {v: "", s: {border: borderBottom}}, // G
                {v: "", s: {border: borderBottom}}, // H
                "" // I
            ]);
            // Row 6
            aoa.push([
                {v: "Location:", s: {font: fontNormal}}, // A
                {v: val('in-location'), s: {font: fontNormal, border: borderBottom}}, // B
                {v: "", s: {border: borderBottom}}, // C
                {v: "", s: {border: borderBottom}}, // D
                {v: "Our Ref.:", s: {font: fontNormal}}, // E
                {v: val('in-our-ref'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, // F
                {v: "", s: {border: borderBottom}}, // G
                {v: "", s: {border: borderBottom}}, // H
                "" // I
            ]);
            // Row 7
            aoa.push([
                "", "", "", "",
                {v: "Rev. No.:", s: {font: fontNormal}}, // E
                {v: val('in-rev'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, // F
                {v: "", s: {border: borderBottom}}, // G
                {v: "", s: {border: borderBottom}}, // H
                "" // I
            ]);
            // Row 8 (自動填入計算好的地點總數 totalQty，只有 B 欄有底框線)
            aoa.push([
                {v: "Fire Damper:", s: {font: fontNormal}}, // A
                {v: totalQty, s: {font: fontNormal, border: borderBottom}}, // B
                "", // C
                "", // D
                "", "", "", "", "" // E-I
            ]);
            
            // Row 9 (Page 1 of 1，"Page"與"of"無底線)
            aoa.push([
                "", "", "", "",
                {v: "Page", s: {font: fontNormal}}, 
                {v: 1, s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, 
                {v: "of", s: {font: fontNormal, alignment: centerAlign}}, 
                {v: 1, s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, 
                ""
            ]);
            
            // Row 10
            aoa.push([
                {v: "Inspected:", s: {font: fontNormal}}, 
                {v: inspectedName, s: {font: fontNormal, border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                "", "", "", "", ""
            ]);
            // Row 11
            aoa.push([]);

            // Headers
            const thStyle = { font: fontNormal, alignment: centerAlign, border: borderAll };
            aoa.push([
                {v: "", s: thStyle}, 
                {v: "Fire Damper", s: thStyle}, 
                {v: "Clean Fire", s: thStyle}, 
                {v: "Inspected", s: thStyle}
            ]);
            aoa.push([
                {v: "Ref. No.", s: thStyle}, 
                {v: "Ref.", s: thStyle}, 
                {v: "Damper", s: thStyle}, 
                {v: "by", s: thStyle}
            ]);

            // Data Rows (利用上面算好的 baseStats 輸出)
            let rowIdx = 1;
            for (const [base, count] of Object.entries(baseStats)) {
                aoa.push([
                    {v: rowIdx, s: thStyle},
                    {v: base, s: thStyle},
                    {v: count, s: thStyle},
                    {v: inspectedName, s: thStyle}
                ]);
                rowIdx++;
            }

            // 在 Total 前加入一行帶有全框線的空白列
            aoa.push([
                {v: "", s: {border: borderAll}},
                {v: "", s: {border: borderAll}},
                {v: "", s: {border: borderAll}},
                {v: "", s: {border: borderAll}}
            ]);

            // Total Row (A 到 D 都有全框線，且文字置中對齊)
            aoa.push([
                {v: "", s: {border: borderAll}},
                {v: "Total:", s: {font: fontNormal, alignment: centerAlign, border: borderAll}},
                {v: totalQty, s: {font: fontNormal, alignment: centerAlign, border: borderAll}},
                {v: "", s: {border: borderAll}}
            ]);

            // Blank spacing rows
            aoa.push([]); aoa.push([]); aoa.push([]); aoa.push([]);

            // Footer Row
            const footerRowIdx = aoa.length;
            aoa.push([
                {v: "Prepared By:", s: {font: fontNormal}},
                {v: val('in-prepared'), s: {font: fontNormal, border: borderBottom}},
                {v: "", s: {border: borderBottom}},
                {v: "Reviewed By:", s: {font: fontNormal}},
                {v: val('in-reviewed'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}},
                {v: "", s: {border: borderBottom}},
                {v: "", s: {border: borderBottom}},
                {v: "", s: {border: borderBottom}},
                ""
            ]);

            const ws = XLSX.utils.aoa_to_sheet(aoa);

            // 定義 Excel 中的所有合併儲存格 (Merges)
            ws['!merges'] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 8 } }, // A1:I1 標題
                { s: { r: 3, c: 1 }, e: { r: 3, c: 3 } }, // B4:D4 (Project)
                { s: { r: 3, c: 5 }, e: { r: 3, c: 7 } }, // F4:H4 (Date)
                { s: { r: 4, c: 5 }, e: { r: 4, c: 7 } }, // F5:H5 (FSD Ref)
                { s: { r: 5, c: 1 }, e: { r: 5, c: 3 } }, // B6:D6 (Location)
                { s: { r: 5, c: 5 }, e: { r: 5, c: 7 } }, // F6:H6 (Our Ref)
                { s: { r: 6, c: 5 }, e: { r: 6, c: 7 } }, // F7:H7 (Rev No)
                { s: { r: 9, c: 1 }, e: { r: 9, c: 3 } }, // B10:D10 (Inspected)
                { s: { r: footerRowIdx, c: 1 }, e: { r: footerRowIdx, c: 2 } }, // 頁尾: B:C (Prepared)
                { s: { r: footerRowIdx, c: 4 }, e: { r: footerRowIdx, c: 7 } }, // 頁尾: E:H (Reviewed)
            ];

            // 完美對應模板的每一欄寬度
            ws['!cols'] = [
                { wch: 12 }, // A 
                { wch: 18 }, // B
                { wch: 14 }, // C 
                { wch: 14 }, // D 
                { wch: 6 },  // E
                { wch: 6 },  // F
                { wch: 4 },  // G
                { wch: 8 },  // H
                { wch: 6 }   // I
            ];

            XLSX.utils.book_append_sheet(workbook, ws, "Summary_Report");
            XLSX.writeFile(workbook, "Summary_Report.xlsx");
        });

        // 功能 3：打包下載 ZIP
        downloadZipBtn.addEventListener('click', async () => {
            if (processedFiles.length === 0) return;

            const originalText = downloadZipBtn.innerText;
            downloadZipBtn.innerText = "打包中，請稍候...";
            downloadZipBtn.disabled = true;
            resetBtn.disabled = true;
            downloadExcelBtn.disabled = true;

            try {
                const zip = new JSZip();
                processedFiles.forEach(item => {
                    zip.file(item.newName, item.file);
                });
                const content = await zip.generateAsync({ type: "blob" });
                
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = "Renamed_Images.zip";
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error("ZIP 打包失敗:", error);
                alert("打包過程發生錯誤，請查看 Console。");
            } finally {
                downloadZipBtn.innerText = originalText;
                downloadZipBtn.disabled = false;
                resetBtn.disabled = false;
                downloadExcelBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
