<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防火閘重新命名與統計</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <style>
        /* 奶油風色票 */
        :root {
            --primary-color: #D4A373;
            --primary-hover: #C38D59;
            --success-color: #8CB369;
            --success-hover: #7A9F5A; 
            --danger-color: #E29578;
            --danger-hover: #CF7E60;
            --bg-color: #FAF8F5;
            --text-color: #5C4D43;
            --border-color: #EAE0D5;
            --warning-color: #F4A261;
            --ai-color: #8E44AD; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(92, 77, 67, 0.08);
            padding: 2rem;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 2rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: #FDFCFB;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .ai-section {
            grid-column: 1 / -1;
            background-color: #F9F0FF;
            border: 1px dashed var(--ai-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #DCD3C6;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #FFFFFF;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .drop-zone {
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #FDFCFB;
            margin-bottom: 2rem;
        }

        .drop-zone.dragover {
            background-color: #F5EBE1;
            border-color: var(--primary-hover);
            transform: scale(1.01);
        }

        .drop-zone p {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .drop-zone span {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #A39184;
        }

        #file-input { display: none; }

        .table-container {
            display: block; 
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #FFFFFF;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #F9F6F0;
            position: sticky;
            top: 0;
            z-index: 10;
            color: var(--text-color);
            font-weight: 600;
        }

        tr:hover { background-color: #FDFCFB; }

        .status-label { color: #7A9F5A; font-weight: 500; }
        .status-warning { color: var(--danger-color); font-weight: 500; }
        .status-ai { color: var(--ai-color); font-weight: 600; }
        
        .empty-state {
            text-align: center;
            color: #A39184;
            padding: 2rem !important;
            font-style: italic;
        }

        .actions {
            display: flex;
            margin-top: 1.5rem;
            text-align: right;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        button {
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        button:active { transform: translateY(1px); }
        .btn-primary { background-color: var(--primary-color); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-excel { background-color: var(--success-color); }
        .btn-excel:hover { background-color: var(--success-hover); }
        .btn-reset { background-color: var(--danger-color); }
        .btn-reset:hover { background-color: var(--danger-hover); }

        button:disabled {
            background-color: var(--border-color) !important;
            color: #A39184 !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>防火閘重新命名與統計</h1>
        
        <div class="form-grid">
            <!-- AI 專屬設定區塊 -->
            <div class="ai-section">
                <div class="form-group">
                    <label>🔑 Gemini API Key：</label>
                    <input type="password" id="api-key" placeholder="輸入 AIzaSy...">
                </div>
                <div class="form-group">
                    <label>🌐 Vercel/Cloudflare Proxy 網址：</label>
                    <input type="text" id="api-proxy" placeholder="https://你的專案.vercel.app/api">
                </div>
                <div style="grid-column: 1 / -1; font-size: 0.85rem; color: var(--ai-color);">
                    💡 提示：填寫上方兩欄後，拖曳圖片將自動啟動 AI 辨識手寫字。
                </div>
            </div>
            
            <!-- Excel 報告欄位 -->
            <div class="form-group"><label>Project:</label><input type="text" id="in-project" placeholder="..."></div>
            <div class="form-group"><label>Location:</label><input type="text" id="in-location" placeholder="..."></div>
            <div class="form-group"><label>Fire Damper:</label><input type="text" id="in-damper" placeholder="..."></div>
            <div class="form-group"><label>Date:</label><input type="text" id="in-date" placeholder="..."></div>
            <div class="form-group"><label>FSD Ref.:</label><input type="text" id="in-fsd" placeholder="..."></div>
            <div class="form-group"><label>Our Ref.:</label><input type="text" id="in-our-ref" placeholder="..."></div>
            <div class="form-group"><label>Rev. No.:</label><input type="text" id="in-rev" placeholder="..."></div>
            <div class="form-group"><label>Inspected:</label><input type="text" id="in-inspected" placeholder="..."></div>
            <div class="form-group"><label>Prepared By:</label><input type="text" id="in-prepared" placeholder="..."></div>
            <div class="form-group"><label>Reviewed By:</label><input type="text" id="in-reviewed" placeholder="..."></div>
        </div>
        
        <div class="drop-zone" id="drop-zone">
            <p>點擊此處選擇圖片，或將圖片拖曳至此</p>
            <span>（支援 .jpg, .png 等常見格式）</span>
            <input type="file" id="file-input" multiple accept="image/*">
        </div>

        <div class="table-container" id="table-container">
            <table id="preview-table">
                <thead>
                    <tr>
                        <th>原始檔名</th>
                        <th>新檔名</th>
                        <th>狀態預覽</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr id="empty-row">
                        <td colspan="3" class="empty-state">尚未上傳任何圖片，請從上方選擇或拖曳檔案</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="actions" id="actions-container">
            <button id="reset-btn" class="btn-reset" disabled>🗑️ 重設清空</button>
            <button id="download-excel-btn" class="btn-excel" disabled>📊 下載統計 Excel</button>
            <button id="download-zip-btn" class="btn-primary" disabled>📦 確認及匯出ZIP檔</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const tbody = document.getElementById('table-body');
        const tableContainer = document.getElementById('table-container');
        
        const downloadZipBtn = document.getElementById('download-zip-btn');
        const downloadExcelBtn = document.getElementById('download-excel-btn');
        const resetBtn = document.getElementById('reset-btn');

        let processedFiles = []; 
        let statsData = {};      

        const val = (id) => document.getElementById(id).value || "";
        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // 轉 Base64
        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        // 拖曳事件
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) processFiles(Array.from(e.dataTransfer.files));
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) processFiles(Array.from(e.target.files));
        });

        // ================= 核心 AI 與命名邏輯 =================
        async function processFiles(files) {
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

            dropZone.style.pointerEvents = 'none';
            resetBtn.disabled = true;
            downloadExcelBtn.disabled = true;
            downloadZipBtn.disabled = true;

            processedFiles = [];
            statsData = {}; 
            let currentLabel = "";
            let currentCounter = 0;
            
            const apiKey = document.getElementById('api-key').value.trim();
            const apiProxy = document.getElementById('api-proxy').value.trim();

            tbody.innerHTML = ''; 

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const originalName = file.name;
                const ext = originalName.slice(originalName.lastIndexOf("."));
                
                // 修正大寫副檔名造成的 MIME Type 空白問題
                let mimeType = file.type;
                if (!mimeType) {
                    if (ext.toLowerCase() === '.jpg' || ext.toLowerCase() === '.jpeg') mimeType = 'image/jpeg';
                    else if (ext.toLowerCase() === '.png') mimeType = 'image/png';
                    else mimeType = 'image/jpeg'; 
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${originalName}</td>
                    <td style="color:#aaa;">${apiKey ? '✨ AI 視覺解析中...' : '處理中...'}</td>
                    <td style="color:#aaa;">⏳ 處理中</td>
                `;
                tbody.appendChild(tr);
                tableContainer.scrollTop = tableContainer.scrollHeight;

                let foundLabel = null;
                let aiErrorMsg = null;

                if (apiKey) {
                    try {
                        const base64Data = await getBase64(file);
                        let baseUrl = apiProxy ? apiProxy.replace(/\/$/, "") : "https://generativelanguage.googleapis.com";
                        const apiUrl = `${baseUrl}/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                        
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "讀取圖片中「防火閘編號：」右側的藍色手寫字。直接回傳文字(如: 巴士站(4))。不要多餘文字，若看不到回傳 NONE。" },
                                        { inline_data: { mime_type: mimeType, data: base64Data } }
                                    ]
                                }],
                                generationConfig: {
                                    temperature: 0.1
                                }
                            })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data.candidates && data.candidates[0].content.parts[0].text) {
                                let extracted = data.candidates[0].content.parts[0].text.trim();
                                if (extracted !== 'NONE' && extracted.length > 0) {
                                    foundLabel = extracted.replace(/[（［]/g, '(').replace(/[）］]/g, ')').replace(/\n/g, '').trim();
                                }
                            }
                        } else {
                            aiErrorMsg = `❌ AI 連線錯誤 (${response.status})`;
                        }
                        
                        // 防止請求過快觸發 429 限制 (每分鐘 15 次)
                        if (i < files.length - 1) {
                            await delay(4000); 
                        }
                        
                    } catch (e) {
                        aiErrorMsg = "❌ 網路或 Proxy 錯誤";
                    }
                }

                let newName = "";
                let statusHtml = "";

                if (foundLabel) {
                    currentLabel = foundLabel; 
                    currentCounter = 1;
                    newName = `${currentLabel}(${currentCounter})${ext}`;
                    statusHtml = `<span class="status-ai">✨ AI 讀取貼紙: ${currentLabel}</span>`;
                } else {
                    const labelRegex = /_([^_]+?)\(1\)(?=\.[^.]+$)/i;
                    const match = originalName.match(labelRegex);

                    if (match) {
                        currentLabel = match[1]; 
                        currentCounter = 1;
                        newName = `${currentLabel}(${currentCounter})${ext}`;
                        statusHtml = `<span class="status-label">✅ 檔名標籤更新: ${currentLabel}</span>`;
                    } else {
                        if (currentLabel !== "") {
                            currentCounter++;
                            newName = `${currentLabel}(${currentCounter})${ext}`;
                            statusHtml = `<span class="status-label">✓ 自動遞增</span>`;
                        } else {
                            newName = originalName;
                            statusHtml = aiErrorMsg ? `<span class="status-warning">${aiErrorMsg}</span>` : `<span class="status-warning">⚠️ 無貼紙也無標籤，保持原名</span>`;
                        }
                    }
                }

                if (currentLabel !== "") {
                    statsData[currentLabel] = (statsData[currentLabel] || 0) + 1;
                }

                processedFiles.push({ file, newName });

                tr.innerHTML = `
                    <td>${originalName}</td>
                    <td><strong>${newName}</strong></td>
                    <td>${statusHtml}</td>
                `;
            }

            dropZone.style.pointerEvents = 'auto';
            resetBtn.disabled = false;
            downloadExcelBtn.disabled = false;
            downloadZipBtn.disabled = false;
        }

        resetBtn.addEventListener('click', () => {
            processedFiles = [];
            statsData = {};
            tbody.innerHTML = `<tr id="empty-row"><td colspan="3" class="empty-state">尚未上傳任何圖片，請從上方選擇或拖曳檔案</td></tr>`;
            resetBtn.disabled = true;
            downloadExcelBtn.disabled = true;
            downloadZipBtn.disabled = true;
            fileInput.value = '';
        });

        // ================= Excel 完美 1:1 匯出 =================
        downloadExcelBtn.addEventListener('click', () => {
            if (Object.keys(statsData).length === 0) return alert("目前沒有成功分類的統計資料！");

            const workbook = XLSX.utils.book_new();
            const inspectedName = val('in-inspected');

            const centerAlign = { horizontal: "center", vertical: "center" };
            const leftAlign = { horizontal: "left", vertical: "center" };
            const rightAlign = { horizontal: "right", vertical: "center" };
            const borderAll = {
                top: { style: "thin" }, bottom: { style: "thin" },
                left: { style: "thin" }, right: { style: "thin" }
            };
            const borderBottom = { bottom: { style: "thin" } };
            const fontTitle = { name: "Arial", sz: 14, bold: true };
            const fontNormal = { name: "Arial", sz: 12 };
            const fontBold = { name: "Arial", sz: 12, bold: true };

            const aoa = [];
            
            // Row 1
            aoa.push([{v: "FIRE DAMPERS INSPECTION", s: {font: fontTitle, alignment: centerAlign}}, "", "", "", "", "", "", "", ""]);
            // Row 2-3
            aoa.push([]); aoa.push([]);
            // Row 4
            aoa.push([
                {v: "Project:", s: {font: fontNormal}}, {v: val('in-project'), s: {font: fontNormal, border: borderBottom}}, "", "", 
                {v: "Date:", s: {font: fontNormal}}, "", {v: val('in-date'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, "", ""
            ]);
            // Row 5
            aoa.push(["", "", "", "", {v: "FSD Ref.:", s: {font: fontNormal}}, "", {v: val('in-fsd'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, "", ""]);
            // Row 6
            aoa.push([
                {v: "Location:", s: {font: fontNormal}}, {v: val('in-location'), s: {font: fontNormal, border: borderBottom}}, "", "", 
                {v: "Our Ref.:", s: {font: fontNormal}}, "", {v: val('in-our-ref'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, "", ""
            ]);
            // Row 7
            aoa.push(["", "", "", "", {v: "Rev. No.:", s: {font: fontNormal}}, "", {v: val('in-rev'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, "", ""]);
            // Row 8
            aoa.push([{v: "Fire Damper:", s: {font: fontNormal}}, {v: val('in-damper'), s: {font: fontNormal, border: borderBottom}}, "", "", "", "", "", "", ""]);
            // Row 9
            aoa.push(["", "", "", "", {v: "Page", s: {font: fontNormal}}, {v: 1, s: {font: fontNormal, alignment: centerAlign}}, {v: "of", s: {font: fontNormal, alignment: centerAlign}}, {v: 1, s: {font: fontNormal, alignment: centerAlign}}, ""]);
            // Row 10
            aoa.push([{v: "Inspected:", s: {font: fontNormal}}, {v: inspectedName, s: {font: fontNormal, border: borderBottom}}, "", "", "", "", "", "", ""]);
            // Row 11
            aoa.push([]);

            // Headers - Row 12, 13
            const thStyle = { font: fontNormal, alignment: centerAlign, border: borderAll };
            aoa.push([{v: "", s: thStyle}, {v: "Fire Damper", s: thStyle}, {v: "Clean Fire", s: thStyle}, {v: "Inspected", s: thStyle}]);
            aoa.push([{v: "Ref. No.", s: thStyle}, {v: "Ref.", s: thStyle}, {v: "Damper", s: thStyle}, {v: "by", s: thStyle}]);

            // Data Processing
            const baseStats = {};
            for (const key of Object.keys(statsData)) {
                const baseLocation = key.replace(/\(\d+\)$/, '').trim();
                baseStats[baseLocation] = (baseStats[baseLocation] || 0) + 1;
            }

            let rowIdx = 1;
            let totalQty = 0;
            for (const [base, count] of Object.entries(baseStats)) {
                aoa.push([{v: rowIdx, s: thStyle}, {v: base, s: thStyle}, {v: count, s: thStyle}, {v: inspectedName, s: thStyle}]);
                totalQty += count;
                rowIdx++;
            }

            // Total Row
            aoa.push(["", {v: "Total:", s: {font: fontBold, alignment: rightAlign}}, {v: totalQty, s: {font: fontBold, alignment: centerAlign, border: borderAll}}, ""]);

            // Footer
            aoa.push([]); aoa.push([]); aoa.push([]); aoa.push([]);
            const footerRowIdx = aoa.length;
            aoa.push([
                {v: "Prepared By:", s: {font: fontNormal}}, {v: val('in-prepared'), s: {font: fontNormal, border: borderBottom}}, "", 
                {v: "Reviewed By:", s: {font: fontNormal}}, {v: val('in-reviewed'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, "", "", "", ""
            ]);

            const ws = XLSX.utils.aoa_to_sheet(aoa);

            ws['!merges'] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 8 } }, // A1:I1
                { s: { r: 3, c: 1 }, e: { r: 3, c: 3 } }, // B4:D4
                { s: { r: 3, c: 6 }, e: { r: 3, c: 8 } }, // G4:I4
                { s: { r: 4, c: 6 }, e: { r: 4, c: 8 } }, // G5:I5
                { s: { r: 5, c: 1 }, e: { r: 5, c: 3 } }, // B6:D6
                { s: { r: 5, c: 6 }, e: { r: 5, c: 8 } }, // G6:I6
                { s: { r: 6, c: 6 }, e: { r: 6, c: 8 } }, // G7:I7
                { s: { r: 7, c: 1 }, e: { r: 7, c: 3 } }, // B8:D8
                { s: { r: 9, c: 1 }, e: { r: 9, c: 3 } }, // B10:D10
                { s: { r: footerRowIdx, c: 1 }, e: { r: footerRowIdx, c: 2 } }, // B:C (Prepared)
                { s: { r: footerRowIdx, c: 4 }, e: { r: footerRowIdx, c: 7 } }  // E:H (Reviewed)
            ];

            ws['!cols'] = [
                { wch: 12 }, { wch: 18 }, { wch: 14 }, { wch: 14 },
                { wch: 6 }, { wch: 6 }, { wch: 4 }, { wch: 8 }, { wch: 6 }
            ];

            XLSX.utils.book_append_sheet(workbook, ws, "Summary_Report");
            XLSX.writeFile(workbook, "Summary_Report.xlsx");
        });

        // ================= 打包 ZIP =================
        downloadZipBtn.addEventListener('click', async () => {
            if (processedFiles.length === 0) return;

            const originalText = downloadZipBtn.innerText;
            downloadZipBtn.innerText = "打包中，請稍候...";
            downloadZipBtn.disabled = true;

            try {
                const zip = new JSZip();
                processedFiles.forEach(item => zip.file(item.newName, item.file));
                const content = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = "Renamed_Images.zip";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                alert("打包過程發生錯誤，請查看 Console。");
            } finally {
                downloadZipBtn.innerText = originalText;
                downloadZipBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
