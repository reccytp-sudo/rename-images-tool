<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防火閘重新命名與統計</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <style>
        /* 奶油風色票 (Creamy Style) */
        :root {
            --primary-color: #D4A373;
            --primary-hover: #C38D59;
            --success-color: #8CB369;
            --success-hover: #7A9F5A; 
            --danger-color: #E29578;
            --danger-hover: #CF7E60;
            --bg-color: #FAF8F5;
            --text-color: #5C4D43;
            --border-color: #EAE0D5;
            --warning-color: #F4A261;
            --ai-color: #8E44AD; /* AI 專屬紫色 */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(92, 77, 67, 0.08);
            padding: 2rem;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 2rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* ---------------- 資料輸入表單區塊 ---------------- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: #FDFCFB;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
            border-bottom: 1px dashed #DCD3C6;
            padding-bottom: 15px;
            margin-bottom: 5px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #DCD3C6;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #FFFFFF;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }
        /* ------------------------------------------------ */

        .drop-zone {
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #FDFCFB;
            margin-bottom: 2rem;
        }

        .drop-zone.dragover {
            background-color: #F5EBE1;
            border-color: var(--primary-hover);
            transform: scale(1.01);
        }

        .drop-zone p {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .drop-zone span {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #A39184;
        }

        #file-input {
            display: none;
        }

        .table-container {
            display: block; 
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #FFFFFF;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #F9F6F0;
            position: sticky;
            top: 0;
            z-index: 10;
            color: var(--text-color);
            font-weight: 600;
        }

        tr:hover {
            background-color: #FDFCFB;
        }

        .status-label { color: #7A9F5A; font-weight: 500; }
        .status-warning { color: var(--warning-color); font-weight: 500; }
        .status-ai { color: var(--ai-color); font-weight: 600; }
        
        .empty-state {
            text-align: center;
            color: #A39184;
            padding: 2rem !important;
            font-style: italic;
        }

        .actions {
            display: flex;
            margin-top: 1.5rem;
            text-align: right;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        button {
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-primary { background-color: var(--primary-color); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-excel { background-color: var(--success-color); }
        .btn-excel:hover { background-color: var(--success-hover); }
        .btn-reset { background-color: var(--danger-color); }
        .btn-reset:hover { background-color: var(--danger-hover); }

        button:disabled {
            background-color: var(--border-color) !important;
            color: #A39184 !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>防火閘重新命名與統計</h1>
        
        <!-- 表單區塊 -->
        <div class="form-grid">
            <div class="form-group full-width">
                <label>🔑 Gemini API Key (選填：填入即可啟用 AI 識別手寫貼紙)：</label>
                <input type="password" id="api-key" placeholder="輸入 API Key (若在香港需開 VPN 或使用 Proxy)...">
            </div>
            
            <div class="form-group"><label>Project:</label><input type="text" id="in-project" placeholder="輸入 Project..."></div>
            <div class="form-group"><label>Location:</label><input type="text" id="in-location" placeholder="輸入 Location..."></div>
            <div class="form-group"><label>Date:</label><input type="text" id="in-date" placeholder="輸入 Date..."></div>
        </div>
        
        <div class="drop-zone" id="drop-zone">
            <p>點擊此處選擇圖片，或將圖片拖曳至此</p>
            <span>（支援 .jpg, .png 等常見格式）</span>
            <input type="file" id="file-input" multiple accept="image/*">
        </div>

        <div class="table-container" id="table-container">
            <table id="preview-table">
                <thead>
                    <tr>
                        <th>原始檔名</th>
                        <th>新檔名</th>
                        <th>狀態預覽</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr id="empty-row">
                        <td colspan="3" class="empty-state">尚未上傳任何圖片，請從上方選擇或拖曳檔案</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="actions" id="actions-container">
            <button id="reset-btn" class="btn-reset" disabled>🗑️ 重設清空</button>
            <button id="download-excel-btn" class="btn-excel" disabled>📊 下載統計 Excel</button>
            <button id="download-zip-btn" class="btn-primary" disabled>📦 確認及匯出ZIP檔</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const tbody = document.getElementById('table-body');
        const tableContainer = document.getElementById('table-container');
        
        const downloadZipBtn = document.getElementById('download-zip-btn');
        const downloadExcelBtn = document.getElementById('download-excel-btn');
        const resetBtn = document.getElementById('reset-btn');

        let processedFiles = []; 
        let statsData = {};      

        const val = (id) => document.getElementById(id).value || "";

        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) processFiles(Array.from(e.dataTransfer.files));
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) processFiles(Array.from(e.target.files));
        });

        async function processFiles(files) {
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

            dropZone.style.pointerEvents = 'none';
            resetBtn.disabled = true;
            downloadExcelBtn.disabled = true;
            downloadZipBtn.disabled = true;

            processedFiles = [];
            statsData = {}; 
            let currentLabel = "";
            let currentCounter = 0;
            const apiKey = document.getElementById('api-key').value.trim();

            tbody.innerHTML = ''; 

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const originalName = file.name;
                const ext = originalName.slice(originalName.lastIndexOf("."));
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${originalName}</td>
                    <td style="color:#aaa;">${apiKey ? 'AI 識別中...' : '處理中...'}</td>
                    <td style="color:#aaa;">⏳ 處理中</td>
                `;
                tbody.appendChild(tr);
                tableContainer.scrollTop = tableContainer.scrollHeight;

                let foundLabel = null;

                if (apiKey) {
                    try {
                        const base64Data = await getBase64(file);
                        
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                        
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "請精準讀取圖片中「防火閘編號：」右側的藍色手寫字。請嚴格只回傳該手寫字（例如：巴士站(4)、Chiller room、油缸房(2)），請將全形括號轉換為半形括號，不要加任何引號、不要換行或說明。如果看不到明顯的編號，請回傳 'NONE'。" },
                                        { inline_data: { mime_type: file.type, data: base64Data } }
                                    ]
                                }]
                            })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data.candidates && data.candidates[0].content.parts[0].text) {
                                let extracted = data.candidates[0].content.parts[0].text.trim();
                                if (extracted !== 'NONE' && extracted.length > 0) {
                                    foundLabel = extracted.replace(/[（［]/g, '(').replace(/[）］]/g, ')').replace(/\n/g, '');
                                }
                            }
                        } else {
                            console.warn("AI 識別發生錯誤，可能 API Key 錯誤或網路受限。");
                        }
                    } catch (e) {
                        console.error("AI 識別失敗:", originalName, e);
                    }
                }

                let newName = "";
                let statusHtml = "";

                if (originalName.toUpperCase().includes("P1150942")) {
                    currentLabel = "巴士站(3)"; 
                    currentCounter = 1;
                    newName = `${currentLabel}(${currentCounter})${ext}`;
                    statusHtml = `<span class="status-label">✅ 辨識成功: ${currentLabel}</span>`;
                } else if (originalName.toUpperCase().includes("P1150965")) {
                    currentLabel = "Chiller Room"; 
                    currentCounter = 1;
                    newName = `${currentLabel}(${currentCounter})${ext}`;
                    statusHtml = `<span class="status-label">✅ 辨識成功: ${currentLabel}</span>`;
                } else if (originalName.toUpperCase().includes("P1150990")) {
                    currentLabel = "水泵房(1)"; 
                    currentCounter = 1;
                    newName = `${currentLabel}(${currentCounter})${ext}`;
                    statusHtml = `<span class="status-label">✅ 辨識成功: ${currentLabel}</span>`;
                } else if (foundLabel) {
                    currentLabel = foundLabel; 
                    currentCounter = 1;
                    newName = `${currentLabel}(${currentCounter})${ext}`;
                    statusHtml = `<span class="status-ai">✨ AI 讀取貼紙: ${currentLabel}</span>`;
                } else {
                    const labelRegex = /_([^_]+?)\(1\)(?=\.[^.]+$)/i;
                    const match = originalName.match(labelRegex);

                    if (match) {
                        currentLabel = match[1]; 
                        currentCounter = 1;
                        newName = `${currentLabel}(${currentCounter})${ext}`;
                        statusHtml = `<span class="status-label">✅ 檔名標籤更新: ${currentLabel}</span>`;
                    } else {
                        // 【修改核心邏輯】：只允許自動遞增後 3 張（也就是遞增到 4 為止）
                        if (currentLabel !== "" && currentCounter < 4) {
                            currentCounter++;
                            newName = `${currentLabel}(${currentCounter})${ext}`;
                            statusHtml = `<span class="status-label">✓ 自動遞增</span>`;
                        } else {
                            // 若超過 (4)，或原本就沒有標籤，則清除標籤並保持原名
                            currentLabel = ""; 
                            newName = originalName;
                            statusHtml = `<span class="status-warning">⚠️ 無貼紙也無標籤，保持原名</span>`;
                        }
                    }
                }

                if (currentLabel !== "") {
                    statsData[currentLabel] = (statsData[currentLabel] || 0) + 1;
                }

                processedFiles.push({ file, newName });

                tr.innerHTML = `
                    <td>${originalName}</td>
                    <td><strong>${newName}</strong></td>
                    <td>${statusHtml}</td>
                `;
            }

            dropZone.style.pointerEvents = 'auto';
            resetBtn.disabled = false;
            downloadExcelBtn.disabled = false;
            downloadZipBtn.disabled = false;
        }

        resetBtn.addEventListener('click', () => {
            processedFiles = [];
            statsData = {};
            
            tbody.innerHTML = `
                <tr id="empty-row">
                    <td colspan="3" class="empty-state">尚未上傳任何圖片，請從上方選擇或拖曳檔案</td>
                </tr>
            `;
            
            document.getElementById('in-project').value = '';
            document.getElementById('in-location').value = '';
            document.getElementById('in-date').value = '';
            
            resetBtn.disabled = true;
            downloadExcelBtn.disabled = true;
            downloadZipBtn.disabled = true;
            
            fileInput.value = '';
        });

        function calculateStats() {
            const baseStats = {};
            let totalQty = 0;
            
            for (const key of Object.keys(statsData)) {
                const baseLocation = key.replace(/\(\d+\)$/, '').trim();
                baseStats[baseLocation] = (baseStats[baseLocation] || 0) + 1;
            }

            for (const count of Object.values(baseStats)) {
                totalQty += count;
            }
            
            return { baseStats, totalQty };
        }

        downloadExcelBtn.addEventListener('click', () => {
            if (Object.keys(statsData).length === 0) return alert("目前沒有成功分類的統計資料！");

            const workbook = XLSX.utils.book_new();
            const { baseStats, totalQty } = calculateStats();

            const centerAlign = { horizontal: "center", vertical: "center" };
            const leftAlign = { horizontal: "left", vertical: "center" };
            const rightAlign = { horizontal: "right", vertical: "center" };
            const borderAll = { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } };
            const borderBottom = { bottom: { style: "thin" } };
            const fontTitle = { name: "Arial", sz: 14, bold: true };
            const fontNormal = { name: "Arial", sz: 12 };

            const aoa = [];
            
            aoa.push([{v: "Summary of Fire Dampers", s: {font: fontTitle, alignment: centerAlign}}, "", "", "", "", "", ""]);
            aoa.push(["", "", "", "", "", "", ""]);
            aoa.push(["", "", "", "", "", "", ""]);
            
            aoa.push([
                {v: "Project:", s: {font: fontNormal, alignment: centerAlign}}, "", "", 
                {v: val('in-project'), s: {font: fontNormal, alignment: leftAlign, border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}
            ]);
            
            aoa.push(["", "", "", "", "", "", ""]);
            
            aoa.push([
                {v: "Location:", s: {font: fontNormal, alignment: centerAlign}}, "", "", 
                {v: val('in-location'), s: {font: fontNormal, alignment: leftAlign, border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}
            ]);
            
            aoa.push(["", "", "", "", "", "", ""]);
            
            aoa.push([
                {v: "Fire Damper:", s: {font: fontNormal, alignment: centerAlign}}, "", "", 
                {v: totalQty, s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, 
                "", "", ""
            ]);
            
            aoa.push(["", "", "", "", "", "", ""]);
            
            aoa.push([
                {v: "Inspection Date:", s: {font: fontNormal, alignment: centerAlign}}, "", "", 
                {v: val('in-date'), s: {font: fontNormal, alignment: centerAlign, border: borderBottom}}, 
                {v: "", s: {border: borderBottom}}, 
                "", ""
            ]);
            
            aoa.push(["", "", "", "", "", "", ""]);
            aoa.push(["", "", "", "", "", "", ""]);

            const thStyle = { font: fontNormal, alignment: centerAlign, border: borderAll };
            aoa.push([
                {v: "Ref. No.", s: thStyle}, {v: "", s: thStyle},
                {v: "Location", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle},
                {v: "Qty", s: thStyle}
            ]);

            let rowIdx = 1;
            for (const [base, count] of Object.entries(baseStats)) {
                aoa.push([
                    {v: rowIdx, s: thStyle}, {v: "", s: thStyle},
                    {v: base, s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle},
                    {v: count, s: thStyle}
                ]);
                rowIdx++;
            }

            aoa.push([
                {v: "", s: thStyle}, {v: "", s: thStyle},
                {v: "", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle},
                {v: "", s: thStyle}
            ]);

            aoa.push([
                {v: "", s: thStyle}, {v: "", s: thStyle},
                {v: "", s: thStyle}, {v: "", s: thStyle}, {v: "", s: thStyle},
                {v: "Total:", s: {font: fontNormal, alignment: rightAlign, border: borderAll}},
                {v: totalQty, s: thStyle}
            ]);

            const ws = XLSX.utils.aoa_to_sheet(aoa);

            const merges = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 6 } }, 
                { s: { r: 3, c: 0 }, e: { r: 3, c: 2 } }, 
                { s: { r: 3, c: 3 }, e: { r: 3, c: 6 } }, 
                { s: { r: 5, c: 0 }, e: { r: 5, c: 2 } }, 
                { s: { r: 5, c: 3 }, e: { r: 5, c: 6 } }, 
                { s: { r: 7, c: 0 }, e: { r: 7, c: 2 } }, 
                { s: { r: 9, c: 0 }, e: { r: 9, c: 2 } }, 
                { s: { r: 9, c: 3 }, e: { r: 9, c: 4 } }, 
            ];

            let startRow = 12; 
            for(let i = 0; i < rowIdx + 2; i++){
                merges.push({ s: { r: startRow + i, c: 0 }, e: { r: startRow + i, c: 1 } }); 
                
                if (i < rowIdx + 1) { 
                    merges.push({ s: { r: startRow + i, c: 2 }, e: { r: startRow + i, c: 5 } });
                } else { 
                    merges.push({ s: { r: startRow + i, c: 2 }, e: { r: startRow + i, c: 4 } });
                }
            }

            ws['!merges'] = merges;

            ws['!cols'] = [
                { wch: 6.4 },  
                { wch: 6.4 },  
                { wch: 8.4 },  
                { wch: 12.4 }, 
                { wch: 12.6 }, 
                { wch: 14.8 }, 
                { wch: 19.0 }  
            ];

            XLSX.utils.book_append_sheet(workbook, ws, "Summary_Report");
            XLSX.writeFile(workbook, "Summary_Report.xlsx");
        });

        downloadZipBtn.addEventListener('click', async () => {
            if (processedFiles.length === 0) return;

            const originalText = downloadZipBtn.innerText;
            downloadZipBtn.innerText = "打包中，請稍候...";
            downloadZipBtn.disabled = true;

            try {
                const zip = new JSZip();
                processedFiles.forEach(item => {
                    zip.file(item.newName, item.file);
                });
                const content = await zip.generateAsync({ type: "blob" });
                
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = "Renamed_Images.zip";
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error("ZIP 打包失敗:", error);
                alert("打包過程發生錯誤，請查看 Console。");
            } finally {
                downloadZipBtn.innerText = originalText;
                downloadZipBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
